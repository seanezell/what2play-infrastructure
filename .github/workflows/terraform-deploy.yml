name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'lambdas/**'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: lambdas/what2play-post-confirmation/package-lock.json

      - name: Install Lambda test dependencies
        run: npm ci
        working-directory: ./lambdas/what2play-post-confirmation

      - name: Run Lambda unit tests
        run: npm test
        working-directory: ./lambdas/what2play-post-confirmation

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format
        run: terraform fmt -recursive

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file variables/terraform.tfvars -var="route53_zone_id=${{ vars.ROUTE53_ZONE_ID }}" -no-color

      - name: Terraform Apply
        id: apply
        run: terraform apply -var-file variables/terraform.tfvars -var="route53_zone_id=${{ vars.ROUTE53_ZONE_ID }}" -auto-approve
